name: Rust, WASM & Lean 4 CI

on:
  push:
    branches: [main, master, dev]
  pull_request:
    branches: [main, master, dev]

jobs:
  rust-and-wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Run Native Unit Tests
        run: cargo test

      - name: Compile WebAssembly Target
        run: cargo build --target wasm32-unknown-unknown --release

      - name: Verify WASM Size
        run: |
          WASM_SIZE=$(wc -c < target/wasm32-unknown-unknown/release/lean_analyzer.wasm)
          echo "WASM Binary Size: $WASM_SIZE bytes"
          if [ "$WASM_SIZE" -gt 65536 ]; then
            echo "Error: WASM binary exceeds 64KB size budget"
            exit 1
          fi

  lean-soundness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Lean 4 Soundness Proofs
        uses: leanprover/lean-action@v1
        with:
          lean-pkg-path: lean
