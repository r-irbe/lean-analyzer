# crates/lean-analyzer/Cargo.toml
# High-speed in-process abstract interpreter and AST evaluator for Lean 4
# Compiles to both native rlib and WebAssembly cdylib (wasm32-unknown-unknown).
# Strict 7-bit ASCII only (INV-001).

[package]
name = "lean-analyzer"
version = "0.1.0"
edition = "2021"
description = "High-speed in-process abstract interpreter and AST evaluator for Lean 4"
license = "Apache-2.0"
authors = ["EASCI / tacit-mui Authors"]

[lib]
crate-type = ["rlib", "cdylib"]

[dependencies]
# Zero dependencies for hermetic WASM build with minimal binary footprint.

[target.'cfg(unix)'.dependencies]
libc = "0.2"

